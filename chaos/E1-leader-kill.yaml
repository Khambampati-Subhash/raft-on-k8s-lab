# E1: kill the Raft leader (one pod with raft-role=leader, labelled by exp.sh just
# before injection). pod-kill is one-shot; duration bounds the experiment.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: e1-leader-kill
  namespace: raftlab
spec:
  action: pod-kill
  mode: one
  duration: 40s
  selector:
    namespaces: [raftlab]
    labelSelectors:
      app: kv
      raft-role: leader

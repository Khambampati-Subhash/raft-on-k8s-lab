# raftwatch in-cluster; also the place we exec raftctl/loadgen from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raftwatch
spec:
  replicas: 1
  selector:
    matchLabels: {app: raftwatch}
  template:
    metadata:
      labels: {app: raftwatch}
    spec:
      containers:
        - name: raftwatch
          image: raftlab:dev
          command: [/raftwatch]
          args: [--service=kv.raftlab.svc.cluster.local, --port=8080, --events-only]
